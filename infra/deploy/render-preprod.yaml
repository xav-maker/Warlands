# Blueprint Render de la préproduction (guide 17.1 et 18). Région Francfort (UE).
# Les services tournent sur l'image publiée par la CI dans ghcr.io : la CI déclenche chaque
# déploiement avec l'image du commit (crochets de déploiement), d'où autoDeploy: false.
# Attention : une synchronisation du Blueprint remet l'image écrite ici (ancienne), dont les migrations
# sont en retard sur la base : le prédéploiement échoue. Garder la synchronisation manuelle, et après
# une synchronisation relancer le job deploy-preprod de la CI (gh run rerun <id> --job <job>).
# Mise en place et exploitation : infra/deploy/README.md.

envVarGroups:
  - name: cr-preprod-commun
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

services:
  - type: web
    name: cr-preprod-web
    runtime: image
    image:
      url: ghcr.io/xav-maker/cinq-regions:73a4a62b1230368fac5c6c37aecaa4d3b50550d7 # image publique ; remplacée à chaque déploiement par celle du commit
    region: frankfurt
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    autoDeploy: false
    # Migrations avant la bascule (guide 17.2, étape 8). Elles doivent rester compatibles avec
    # l'ancienne version, qui sert encore les joueurs pendant ce temps (guide 17.4).
    preDeployCommand: /entrypoint.sh migrate
    envVars:
      - fromGroup: cr-preprod-commun
      - key: APP_ROLE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: cr-preprod-db
          property: connectionString
      # APP_URL : sans valeur, l'adresse onrender.com du service est utilisée. À renseigner avec un domaine personnalisé.
      - key: APP_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: 'true'
      # Outils de test (porte de donjon sur la page de route ; aucune troupe gratuite) : préproduction seulement.
      - key: ENABLE_TEST_TOOLS
        value: 'true'
      # Fournisseur d'e-mail transactionnel (Brevo : smtp-relay.brevo.com, port 587, identifiant et clé SMTP).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: worker
    name: cr-preprod-worker
    runtime: image
    image:
      url: ghcr.io/xav-maker/cinq-regions:73a4a62b1230368fac5c6c37aecaa4d3b50550d7
    region: frankfurt
    plan: starter
    autoDeploy: false
    envVars:
      - fromGroup: cr-preprod-commun
      - key: APP_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: cr-preprod-db
          property: connectionString

databases:
  - name: cr-preprod-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: '17'
    databaseName: cr
    user: cr
    ipAllowList: [] # accès par le réseau privé de Render seulement
