# Environnement de développement local (guide 17.1) : Postgres et Mailpit.
name: cinq-regions
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cr
      POSTGRES_PASSWORD: cr
      POSTGRES_DB: cr
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cr -d cr']
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['8025:8025', '1025:1025']
volumes:
  pgdata:
