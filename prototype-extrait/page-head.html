<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Press+Start+2P&display=swap">
<style>
/* Mise en page : un plateau de campagne. En-tête à onglets, puis deux camps face à face séparés par la ligne de front. */
:root {
  --bg: #e9ece6; --surface: #f7f8f4; --sunk: #dfe3dc; --ink: #1c2320; --muted: #5a665f; --line: #c6cec6;

  --f-display: 'Alegreya SC', Georgia, serif; --f-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif; --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --surface: #1c221f; --sunk: #232a26; --ink: #e4eae5; --muted: #9aa69f; --line: #34403a;
  --a: #74b4d6; --a-soft: #1f3440; --b: #d98aa9; --b-soft: #3d2330; --brass: #ddb04e;
  --hp: #62b874; --will: #a48ff0; --energy: #e2b03e; --mana: #64a9e6; --bad: #f07a6c; --good: #6cc784; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c221f; --sunk: #232a26; --ink: #e4eae5; --muted: #9aa69f; --line: #34403a;
  --a: #74b4d6; --a-soft: #1f3440; --b: #d98aa9; --b-soft: #3d2330; --brass: #ddb04e;
  --hp: #62b874; --will: #a48ff0; --energy: #e2b03e; --mana: #64a9e6; --bad: #f07a6c; --good: #6cc784; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap-page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }

button, select, input, textarea { font: inherit; color: var(--ink); }

button:hover:not(:disabled) { border-color: var(--muted); }

:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

input.num { width: 4.6em; font-family: var(--f-mono); }
input.num.small { width: 4em; }
input.num.wide { width: 9em; }
.row { display: flex; align-items: center; }
.gap { gap: 10px 14px; } .gap-s { gap: 6px; } .wrap { flex-wrap: wrap; }
.row.gap, .row.gap-s { flex-wrap: wrap; }
.meta { color: var(--muted); font-size: .88rem; }
.dim { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 2px; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field.inline { flex-direction: row; align-items: center; gap: 6px; }
.field select, .field input { text-transform: none; letter-spacing: 0; font-size: .95rem; color: var(--ink); }
.warn { color: var(--bad); font-size: .9rem; }

/* Composition */
.compo { display: grid; gap: 18px; }
.intro { display: grid; gap: 12px; }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; align-items: start; }
.side { display: grid; gap: 12px; min-width: 0; }
.side-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; padding-bottom: 6px; border-bottom: 3px solid var(--a); }
.side-b .side-head { border-bottom-color: var(--b); }
.side-head .sub { font: 400 .9rem var(--f-body); color: var(--muted); }
.usage { display: flex; gap: 12px; font: .85rem var(--f-mono); color: var(--muted); }
.usage.over { color: var(--bad); }
.troop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; min-width: 0; }
.troop-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin: 0; }

.unit-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--bg); }
.skills .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
/* Vue 8 bits : le canvas garde ses pixels nets, quelle que soit la taille d'affichage */
.pixel-view { display: grid; gap: 10px; margin-top: 8px; min-width: 0; }
.pixel-frame { background: #0c0a12; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.pixel-frame canvas { display: block; width: 100%; max-width: 1024px; aspect-ratio: 16 / 9; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.pixel-view .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); min-width: 0; }
.pixel-view .legend > span { min-width: 0; max-width: 100%; }
.pixel-view .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
.pixel-view .roster { margin-right: 8px; white-space: nowrap; }
.pixel-view progress { width: 100%; }
.watch-done { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; align-items: center; }
.watch-done[hidden] { display: none; }
.seg button.on { background: var(--a-soft); border-color: var(--a); }
.rules { border-top: 1px solid var(--line); padding-top: 6px; }
.rules summary { cursor: pointer; font-weight: 700; }
.rules ol { margin: 8px 0; padding-left: 1.6em; display: grid; gap: 6px; }
.rule { font-size: .9rem; }
.rule > * { margin-right: 4px; margin-bottom: 3px; vertical-align: middle; max-width: 100%; }
.rule select { font-size: .88rem; padding: 3px 4px; }
.rule .kw { font: .8rem var(--f-mono); color: var(--muted); }
.rule .rule-tools { display: inline-flex; gap: 3px; }
.rule .rule-tools button { padding: 1px 6px; min-width: 0; font-size: .8rem; }
.rule.inactive select { opacity: .55; }
.rule .note { color: var(--bad); font-size: .8rem; display: block; margin-top: 2px; }
.chip { padding: 3px 9px; border-radius: 999px; font-size: .85rem; }
.chip.on { background: var(--a-soft); border-color: var(--a); }
.side-b .chip.on { background: var(--b-soft); border-color: var(--b); }
.chip.passive { font-style: italic; }
.chip small { color: var(--muted); font-style: normal; }
.rules summary { cursor: pointer; font-weight: 700; }
.rules ol { margin: 8px 0; padding-left: 1.6em; display: grid; gap: 6px; }
.rule { font-size: .9rem; }
.rule > * { margin-right: 4px; vertical-align: middle; }
.rule select { font-size: .88rem; padding: 3px 4px; }
.rule .kw { font: .8rem var(--f-mono); color: var(--muted); }
.rule .rule-tools { display: inline-flex; gap: 3px; }
.rule .rule-tools button { padding: 1px 6px; min-width: 0; font-size: .8rem; }
.rule.inactive select { opacity: .55; }
.rule .note { color: var(--bad); font-size: .8rem; display: block; margin-top: 2px; }
.add-troop { display: flex; gap: 8px; flex-wrap: wrap; }
.add-troop select { flex: 1 1 220px; min-width: 0; }

/* Combat */
.combat { display: grid; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.result { font-weight: 700; padding: 4px 10px; border-radius: var(--r); }
.r-a { background: var(--a-soft); color: var(--a); } .r-b { background: var(--b-soft); color: var(--b); }
.arena-wrap { overflow-x: auto; }
.arena { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)) 10px repeat(3, minmax(150px, 1fr)); gap: 6px; min-height: 240px; }
.lane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lane-a { border-top: 3px solid var(--a); } .lane-b { border-top: 3px solid var(--b); }
.lane-label { font: .72rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.lane-units { display: flex; flex-direction: column; gap: 6px; }
.front { background: repeating-linear-gradient(180deg, var(--brass) 0 8px, transparent 8px 14px); width: 2px; justify-self: center; opacity: .7; }
.token { position: relative; background: var(--bg); border: 1px solid var(--line); border-left: 4px solid var(--a); border-radius: 4px; padding: 5px 6px; display: grid; gap: 3px; transition: transform .2s, box-shadow .2s; }
.token.tb { border-left-color: var(--b); }
.token.actor { box-shadow: 0 0 0 2px var(--brass); transform: translateY(-2px); }
.token.target { box-shadow: 0 0 0 2px var(--bad); }
.token.dead { opacity: .4; filter: grayscale(1); }
.token.fled { opacity: .5; border-style: dashed; }
.tk-head { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.tk-id { font: 500 .72rem var(--f-mono); color: var(--muted); }
.tk-name { font-weight: 700; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { position: relative; height: 13px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; transition: width .25s; }
.bar span { position: relative; font: 500 .66rem/13px var(--f-mono); padding-left: 4px; color: var(--ink); font-variant-numeric: tabular-nums; }
.g-hp i { background: color-mix(in srgb, var(--hp) 70%, transparent); }
.g-will i { background: color-mix(in srgb, var(--will) 60%, transparent); }
.g-energy i { background: color-mix(in srgb, var(--energy) 60%, transparent); }
.g-mana i { background: color-mix(in srgb, var(--mana) 60%, transparent); }
.bar.g-will, .bar.g-energy, .bar.g-mana { height: 9px; }
.bar.g-will span, .bar.g-energy span, .bar.g-mana span { font-size: .58rem; line-height: 9px; }
.tk-states { display: flex; flex-wrap: wrap; gap: 3px; }
.st { font-size: .7rem; padding: 0 5px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); white-space: nowrap; }
.tk-flag { position: absolute; top: 4px; right: 6px; font: 700 .7rem var(--f-mono); color: var(--bad); text-transform: uppercase; }
.float { position: absolute; right: 6px; top: -6px; font: 700 .95rem var(--f-mono); animation: rise .7s ease-out both; }
.float.dmg { color: var(--bad); } .float.heal { color: var(--good); }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(-6px); opacity: 1; } }
.player { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.player input[type=range] { width: 100%; accent-color: var(--brass); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.now { min-height: 1.5em; font-size: .95rem; }
.clock { font: .85rem var(--f-mono); white-space: nowrap; }
.log-head { justify-content: space-between; }
.check { font-size: .88rem; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 6px 0; max-height: 360px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: .9rem; position: relative; }
.log li { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; padding: 2px 10px; cursor: pointer; }
.log li:hover { background: var(--sunk); }
.log li.cur { background: color-mix(in srgb, var(--brass) 18%, transparent); }
.log li.future { opacity: .45; }
.log .t { font: .78rem/1.6 var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.who { font-weight: 700; } .who-a { color: var(--a); } .who-b { color: var(--b); }
.dmg { color: var(--bad); } .heal { color: var(--good); } .bad { color: var(--bad); }

/* Simulation */
.sim { display: grid; gap: 14px; }
.winbar { display: flex; height: 18px; border-radius: var(--r); overflow: hidden; background: var(--sunk); }
.winbar i { display: block; height: 100%; transition: width .2s; }
.winbar .wa { background: var(--a); } .winbar .wb { background: var(--b); }
.winbar .wt { background: repeating-linear-gradient(45deg, var(--b) 0 6px, var(--b-soft) 6px 12px); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.kpis div { display: grid; }
.kpis b { font: 500 1.5rem var(--f-mono); font-variant-numeric: tabular-nums; }
.kpis span { color: var(--muted); font-size: .85rem; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td:nth-child(n+3) { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
th { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }

/* Réglages */
.settings { display: grid; gap: 22px; }
.settings section { display: grid; gap: 8px; min-width: 0; }
.about ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 80ch; }
textarea { width: 100%; min-height: 420px; font: .82rem/1.4 var(--f-mono); resize: vertical; }
textarea.short { min-height: 200px; }

@media (max-width: 760px) {
  .arena { grid-template-columns: 1fr; min-height: 0; }
  .arena .lane-a[data-rank="3"] { order: 7; } .arena .lane-a[data-rank="2"] { order: 6; } .arena .lane-a[data-rank="1"] { order: 5; }
  .arena .front { order: 4; width: 100%; height: 2px; background: repeating-linear-gradient(90deg, var(--brass) 0 8px, transparent 8px 14px); }
  .arena .lane-b[data-rank="1"] { order: 3; } .arena .lane-b[data-rank="2"] { order: 2; } .arena .lane-b[data-rank="3"] { order: 1; }
  .lane-units { flex-direction: row; flex-wrap: wrap; }
  .lane-units .token { flex: 1 1 140px; min-width: 0; }
  .player { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  nav.tabs { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Prototype ville et territoire */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.span2 { grid-column: 1 / -1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel .sub { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
h4 { margin: 0; font-size: .95rem; }
.hero { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.status { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: .85rem; padding: 2px 9px; border-radius: 999px; background: var(--sunk); white-space: nowrap; }
.pill b { font-family: var(--f-mono); font-weight: 500; }
.pill.where.territoire { background: var(--b-soft); color: var(--b); font-weight: 700; }
.pill.where.ville { background: var(--a-soft); color: var(--a); font-weight: 700; }
nav.tabs button.off { opacity: .45; }
.good { color: var(--good); } .badge { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--sunk); white-space: nowrap; }
.badge.good { background: color-mix(in srgb, var(--good) 15%, transparent); }
.small, button.small, select.small { font-size: .82rem; }
button.small { padding: 2px 8px; }
.recipes, .recruits { display: grid; gap: 8px; }
.recipe { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.5fr) auto; gap: 4px 14px; align-items: center; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); }
.recipe > .meta.small { grid-column: 1 / -1; order: 5; }
.ings { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.ing { font-size: .85rem; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); }
.ing.ok { border-color: color-mix(in srgb, var(--good) 60%, transparent); }
.ing.miss { border-color: color-mix(in srgb, var(--bad) 60%, transparent); color: var(--bad); }
.ing small { color: var(--muted); }
.shop { display: grid; gap: 4px; }
.shop-row, .inv-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.inv { display: grid; }
.tag { font-size: .72rem; margin-left: 6px; padding: 0 6px; border-radius: 3px; background: color-mix(in srgb, var(--brass) 20%, transparent); color: var(--brass); white-space: nowrap; }
.journal { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; font-size: .9rem; color: var(--muted); }
.journal li:first-child { color: var(--ink); }
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; position: relative; }
.track li { display: grid; justify-items: center; text-align: center; gap: 2px; position: relative; padding-top: 2px; }
.track li::before { content: ""; position: absolute; top: 17px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.track li:first-child::before { display: none; }
.track .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); border: 2px solid var(--line); font: 700 .9rem var(--f-mono); position: relative; z-index: 1; }
.track .lbl { font-size: .85rem; font-weight: 500; }
.track small { color: var(--muted); font: .72rem var(--f-mono); }
.track .done .dot { background: color-mix(in srgb, var(--good) 25%, var(--surface)); border-color: var(--good); }
.track .here .dot { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 35%, transparent); }
.track .here .lbl { color: var(--brass); font-weight: 700; }
.track .boss .dot { color: var(--b); }
.step h2 { font-size: 1.35rem; }
