# Paramètres du moteur (engine), de l’économie (eco) et des générateurs.

engine:
  timeLimit: 3000
  tick: 20
  waitRegen: 50
  waitManaRegen: 50
  woundWill: 500
  allyDeathWill: 100
  sameTroopDeathWill: 200
  killWill: 100
  hasteMod: 750
  slowMod: 1250
  resCap: 750
  resFloor: -1000
  moveMult: 1000
  fleeMult: 2000
  manaSkipsRule: 1
  stallTime: 100
  dotTick: 4
  healMult: 1200
  healCooldown: 60
  hotCooldown: 100
eco:
  startGold: 1000 # or de départ [Xavier, 5 novembre 2026]
  # Deux milicien, deux chasseur et deux herboriste de niveau 1 (le prototype donnait un milicien et un chasseur : trop peu pour la première route).
  startTroops: [[milicien, 1], [milicien, 1], [chasseur, 1], [chasseur, 1], [herboriste, 1], [herboriste, 1]]
  startItems: { bandage: 3 }
  startRecipe: acolyte
  manaRegenEnd: 25
  # Réglés par `pnpm content simulate` (escouades de référence équipées, balance/squads.yaml) : 50 % de victoires
  # aux étapes du palier 1, 10 % au palier 5 (−10 points par palier), gardiens 5 points plus bas. Le prototype
  # avait [1250, 1700, 2300, 4500, 3800] (PV), [1200, 1500, 1900, 3200, 2800] (attaque) et [1000, 1000, 1050, 480, 1050] (gardien).
  monsterHp: [1652, 3084, 3772, 6104, 11753]
  monsterAtk: [1587, 2721, 3116, 4341, 8660]
  guardianAdj: [502, 292, 356, 449, 428]
  bagSlots: 20
  bankSlots: 100
  buyBack: 0.2
  sellMarkup: 1.5
  shopRoll: 800
  recruitGoldPerPop: 40
  craftGoldPerTier: 6
  xpPerMonsterLevelPop: 8
  maxLevel: 30
  table: { materiau: 85, composant: 5, consommable: 7, equipement: 3 }
  guardianTable: { composant: 50, equipement: 30, materiau: 20 }
gauges: { mult: 3 }
items:
  boost: 2
  tierBudget: { '1': 10, '2': 20, '3': 35, '4': 55, '5': 80 }
  tierNStats: { '1': 2, '2': 2, '3': 3, '4': 3, '5': 4 }
  tierLevel: { '1': 1, '2': 6, '3': 11, '4': 16, '5': 21 }
  statCost:
    atk: { per: 1 }
    for: { per: 1 }
    ele: { per: 1 }
    esp: { per: 1 }
    foi: { per: 1 }
    omb: { per: 1 }
    hp: { per: 5 }
    will: { per: 3 }
    energy: { per: 4 }
    mana: { per: 3 }
    res: { per: 2, unit: '%' }
    wdmg: { per: 1 }
    wspeed: { per: 0.25 }
    wcost: { per: 0.5 }
recipes:
  craftConsumables: [bandage, potion_mineure, potion_soin, potion_mana, potion_mana_normale, potion_majeure, tonique]
  consumableTags:
    bandage: [fil, cuir, herbe]
    potion_mineure: [herbe, essence]
    potion_soin: [herbe, essence, bete]
    potion_mana: [essence, plume, herbe]
    potion_mana_normale: [essence, plume]
    potion_majeure: [herbe, essence, bete]
    tonique: [essence, herbe]
  consumableValueMult: 0.7
  recruitValue: [0, 1, 2.5, 5, 9, 15]
rares: { chance: 15, minWins: 10 }

# Règles du jeu en ligne qui n'existent pas dans le prototype (README partie II) ; [H] = à régler.
online:
  # Moteur joué pour ce contenu (v1 : 5 puissances, immunités, soins fixes, README 19) ; ajustement du
  # gardien appliqué à toute sa rencontre, escorte comprise, comme dans le tableau du README 6.2 : limité au
  # boss (README 16, point 2) il ne peut pas compenser l'escorte, grosse de 16 à 21 de population.
  engineVersion: v1
  guardianAdjust: all
  squad: { maxUnits: 8, maxPop: 11 } # README 20 [Xavier]
  encounters: { popMult: 2, slots: 8 } # README 20 [H] : population des étapes ×2, 8 emplacements
  # Taille des piles par famille (prototype : constante STACK de monde.ts).
  stack: { materiau: 50, composant: 20, consommable: 10, trophee: 20 }
  # Blocage de rediffusion : durée du combat lue à cette vitesse (README 10.2, point ouvert 2) [H].
  watch: { instantsPerSecond: 100 }
  # Chat de région et messages privés (README 25 [H]). Le filtre masque ces mots (casse, accents et
  # séparateurs ignorés) et compte l'infraction ; la liste se complète ici, sans toucher au code.
  chat:
    maxLength: 300
    bannedWords: [connard, connasse, salope, enculé, pute, fdp, ntm, nazi, pédé, batard]

# Donjons (README 23 [Xavier, formules H], guide 9).
dungeons:
  doorChance: 20 # ‰ à chaque changement d'étape d'une route à donjon (2 % [Xavier])
  bossEvery: 4 # un boss toutes les 4 salles [Xavier]
  levelBonus: 2 # niveau des monstres = min(levelCap, L + levelBonus + floor((n − 1) / 2))
  levelCap: 30
  overpower: 60 # au-delà du plafond : PV et puissances + 6 % par niveau
  pop: { solo: [3, 1, 11], duo: [6, 2, 22] } # population du groupe : min(base + pas × n, plafond), boss compris
  slots: { solo: 8, duo: 16 }
  goldBase: 10 # or d'une salle : goldBase × T² × (1 + n / 4)
  draws: 2 # tirages par salle gagnée
  table: { materiau: 70, composant: 12, consommable: 10, equipement: 8 }
  equipRollPerRoom: 10 # ‰ de jet de puissance en plus par salle
  equipRollCap: 1400
  uniqueChance: 25 # % : objet unique plutôt qu'un composant sur un boss
  mult: 1000 # réglage global de la difficulté des salles, en ‰
  inviteSeconds: 60
  idleMinutes: 5 # absence en duo qui vaut « quitter » (README 26)
  randomInvites: 20 # joueurs disponibles sollicités par une invitation au hasard (guide 9.1)
