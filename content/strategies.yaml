# Stratégies par défaut : règles si/alors de chaque troupe, dans l’ordre (le joueur ne les édite pas).

milicien:
  - { cond: selfEnergyBelow, v: 15, action: repos, target: self }
  - { cond: allyHpBelow, v: 60, action: mur_boucliers, target: self }
  - { cond: selfLacksState, s: provocation, action: provocation, target: self }
  - { cond: always, action: execution, target: weakestEnemy }
  - { cond: targetLacksState, s: etourdi, action: coup_bouclier, target: nearestEnemy }
  - { cond: selfEnergyAbove, v: 80, action: repousser, target: nearestEnemy }
  - { cond: selfEnergyAbove, v: 50, action: exploit, target: nearestEnemy }
  - { cond: always, action: emploi, target: nearestEnemy }
  - { cond: noEnemyInRange, action: avancer, target: self }
frondeurs:
  - { cond: selfEnergyBelow, v: 15, action: repos, target: self }
  - { cond: targetLacksState, s: marque, action: marque, target: strongestEnemy }
  - { cond: enemiesAtLeast, v: 3, action: volee, target: nearestEnemy }
  - { cond: enemiesAtLeast, v: 3, action: rafale, target: nearestEnemy }
  - { cond: selfEnergyAbove, v: 40, action: carreau_lourd, target: weakestEnemy }
  - { cond: always, action: tir_fronde, target: weakestEnemy }
  - { cond: noEnemyInRange, action: avancer, target: self }
acolyte:
  - { cond: allyHpBelow, v: 40, action: priere, target: self }
  # allyHpBelow ne compte pas l'unité elle-même (README 16.4) : sans la deuxième règle, l'acolyte, souvent la cible des
  # tireurs au rang 3, ne se soignait jamais. Seuils relevés (50 → 75 %) : à 50 elle laissait ses alliés tomber bas.
  - { cond: allyHpBelow, v: 75, action: soin_mineur, target: mostWoundedAlly }
  - { cond: selfHpBelow, v: 60, action: soin_mineur, target: self }
  - { cond: targetHasState, s: poison, action: purification, target: mostWoundedAlly }
  - { cond: allyHpBelow, v: 70, action: bouclier_foi, target: mostWoundedAlly }
  - { cond: allyHpBelow, v: 85, action: regeneration, target: mostWoundedAlly }
  - { cond: selfWillBelow, v: 50, action: meditation, target: self }
  - { cond: targetLacksState, s: confusion, action: confusion, target: strongestEnemy }
  - { cond: always, action: trait_sacre_renforce, target: nearestEnemy }
  - { cond: always, action: trait_sacre, target: nearestEnemy }
  - { cond: always, action: emploi, target: nearestEnemy }
  - { cond: always, action: attendre, target: self }
