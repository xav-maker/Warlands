skill.emploi.name: Emploi d'arme
skill.emploi.desc: "1x dégâts de l'arme. DE : un autre ennemi. EC : se frappe."
skill.exploit.name: Exploit d'arme
skill.exploit.desc: '2x dégâts + spécial (Saignement si tranchant, Étourdi si contondant). DE : rien. EC : frappe un allié.'
skill.meditation.name: Méditation
skill.meditation.desc: '+20 % de volonté. DE : +5 %. EC : perd 10 % de PV.'
skill.repos.name: Repos
skill.repos.desc: "+10 % d'énergie. DE : rien. EC : perd 7,5 % de PV."
skill.coup_bouclier.name: Coup de bouclier
skill.coup_bouclier.desc: '0,5x dégâts + Étourdi 30. DE : sans étourdir. EC : s’étourdit.'
skill.repousser.name: Repousser
skill.repousser.desc: '0,5x dégâts, la cible recule (Étourdi 30 si déjà à 3). DE : sans recul. EC : le lanceur recule.'
skill.repousser_renforce.name: Repousser renforcé
skill.repousser_renforce.desc: Repousser sur tous les ennemis au contact.
skill.provocation.name: Provocation
skill.provocation.desc: 'Les attaques ennemies doivent le viser s’il est à portée, 60 instants. DE : 30. EC : −15 % de volonté.'
skill.riposte.name: Riposte
skill.riposte.desc: 'Réaction : touché au corps à corps, contre-attaque à 0,5x (10 énergie).'
skill.dernier_rempart.name: Dernier rempart
skill.dernier_rempart.desc: 'Passif, une fois : un allié du même rang qui devrait mourir reste à 1 PV ; −20 % de volonté.'
skill.mur_boucliers.name: Mur de boucliers
skill.mur_boucliers.desc: 'Bouclier de 25 aux alliés de son rang, 80 instants. DE : sur lui seul.'
skill.execution.name: Exécution
skill.execution.desc: '1x dégâts, triplés sous 25 % de PV. DE : rien. EC : frappe un allié.'
skill.fracas.name: Fracas
skill.fracas.desc: '1x dégâts, triplés si la cible est Gelée (brise le gel). DE : 0,5x. EC : frappe un allié.'
skill.brise_armure.name: Brise-armure
skill.brise_armure.desc: '0,5x dégâts et −20 % de résistance physique, cumulable 3. DE : sans l’affaiblissement. EC : sur soi.'
skill.charge.name: Charge
skill.charge.desc: 'Avance au rang 1 et frappe à 1,5x. DE : avance sans frapper. EC : avance et s’étourdit.'
skill.tir_fronde.name: Tir de fronde
skill.tir_fronde.desc: "1x dégâts de l'arme, portée 3. DE : autre ennemi. EC : touche un allié."
skill.volee.name: Volée
skill.volee.desc: '0,6x dégâts à tout un rang. DE : une seule unité. EC : rien.'
skill.tir_arc.name: Tir à l'arc
skill.tir_arc.desc: "1x dégâts de l'arme, portée 4. DE : autre ennemi. EC : touche un allié."
skill.tir_precis.name: Tir précis
skill.tir_precis.desc: '2x dégâts, ignore 50 % des résistances. DE : 1x. EC : rien.'
skill.marque.name: Marque du chasseur
skill.marque.desc: 'Les 3 prochaines attaques alliées sur la cible font +30 %. DE : 1 attaque. EC : sur un allié.'
skill.soin_mineur.name: Soin mineur
skill.soin_mineur.desc: '+25 % des PV max. DE : +10 %. EC : −10 %.'
skill.regeneration.name: Régénération
skill.regeneration.desc: '+3 % des PV max par tic, 100 instants. DE : 50. EC : sur un ennemi.'
skill.priere.name: Prière collective
skill.priere.desc: '+10 % des PV max à tous les alliés. DE : son rang. EC : −20 % de volonté.'
skill.purification.name: Purification
skill.purification.desc: 'Retire les états négatifs. DE : le plus récent. EC : retire les positifs.'
skill.trait_sacre.name: Trait sacré
skill.trait_sacre.desc: '20 dégâts sacrés, x2 contre mort-vivant et démon. DE : moitié. EC : soigne la cible.'
skill.trait_sacre_renforce.name: Trait sacré renforcé
skill.trait_sacre_renforce.desc: Trait sacré, x3 contre mort-vivant et démon.
skill.bouclier_foi.name: Bouclier de foi
skill.bouclier_foi.desc: 'Bouclier de 40 PV, 100 instants. DE : 15. EC : rien.'
skill.aura_serenite.name: Aura de sérénité
skill.aura_serenite.desc: 'Passif : +5 % de volonté par tic aux alliés de son rang.'
skill.confusion.name: Confusion
skill.confusion.desc: 'La prochaine action de la cible est un demi-échec. DE : −10 % de volonté. EC : sur soi.'
skill.confusion_moine.name: Confusion (moine)
skill.confusion_moine.desc: Confusion sans mana, 20 énergie.
skill.trait_flammes.name: Trait de flammes
skill.trait_flammes.desc: '15 dégâts de feu + Brûlure courte. DE : sans brûlure. EC : Brûlure sur soi.'
skill.boule_feu.name: Boule de feu
skill.boule_feu.desc: '30 à la cible, 10 à son rang, Brûlure. DE : autre unité du rang. EC : explose sur son rang.'
skill.arme_enflammee.name: Arme enflammée
skill.arme_enflammee.desc: 'Les attaques d’arme de l’allié ajoutent 8 feu et Brûlure, 80 instants. DE : 40. EC : Brûlure sur l’allié.'
skill.mur_flammes.name: Mur de flammes
skill.mur_flammes.desc: 'Brûlure à tout un rang ennemi. DE : une unité. EC : son propre rang.'
skill.embrasement.name: Embrasement
skill.embrasement.desc: 'Chaque ennemi qui brûle subit le double des dégâts de brûlure restants. DE : le plus proche. EC : les alliés.'
skill.coeur_ardent.name: Cœur ardent
skill.coeur_ardent.desc: 'Passif : dégâts de feu +20 % sur les cibles qui brûlent.'
skill.lame_saignante.name: Lame saignante
skill.lame_saignante.desc: '0,8x dégâts + Saignement. DE : sans saignement. EC : saigne lui-même.'
skill.cri_guerre.name: Cri de guerre
skill.cri_guerre.desc: '+20 % de volonté et +10 % d’attaque aux alliés, 80 instants. DE : lui seul. EC : −10 % de volonté.'
skill.rage.name: Rage
skill.rage.desc: 'Passif : +2 % d’attaque par 10 % de PV perdus ; ses blessures ne baissent pas sa volonté.'
skill.tourbillon.name: Tourbillon
skill.tourbillon.desc: '1x dégâts à tous les ennemis au contact. DE : moitié. EC : touche aussi son rang.'
skill.morsure.name: Morsure
skill.morsure.desc: '1x dégâts + Saignement si la cible est sous 50 %. DE : sans saignement. EC : rien.'
skill.hurlement.name: Hurlement
skill.hurlement.desc: '+15 % de volonté aux alliés, −10 % aux ennemis des rangs 1 et 2. DE : alliés seulement. EC : −10 % aux alliés.'
skill.instinct_meute.name: Instinct de meute
skill.instinct_meute.desc: 'Passif : +15 % sur une cible déjà attaquée par l’autre loup depuis le dernier tic.'
skill.drain.name: Drain de vie
skill.drain.desc: '20 ténèbres, récupère la moitié. DE : sans soin. EC : le lien s’inverse.'
skill.murmure.name: Murmure de terreur
skill.murmure.desc: '10 psychiques et −25 % de volonté. DE : −10 %. EC : −15 % sur soi.'
skill.terreur_masse.name: Terreur de masse
skill.terreur_masse.desc: Murmure de terreur sur tout un rang.
skill.malediction.name: Malédiction de faiblesse
skill.malediction.desc: '−25 % de résistance à tout, 80 instants. DE : 40. EC : sur soi.'
skill.nuage.name: Nuage pestilentiel
skill.nuage.desc: 'Poison sur un rang (3 par tic, cumulable 3). DE : une unité. EC : son propre rang.'
skill.nuage_renforce.name: Nuage renforcé
skill.nuage_renforce.desc: Nuage pestilentiel, 5 charges max.
skill.lien_vital.name: Lien vital
skill.lien_vital.desc: '30 % des dégâts subis par le lanceur sont renvoyés sur la cible, 60 instants. DE : 30. EC : sens inverse.'
skill.non_mort.name: Non-mort
skill.non_mort.desc: 'Passif : insensible au Poison et au Saignement.'
skill.contagion.name: Contagion
skill.contagion.desc: 'Passif : quand un ennemi empoisonné meurt, son poison passe au plus proche.'
skill.pieges_glace.name: Pièges de glace
skill.pieges_glace.desc: 'Passif : le premier ennemi qui avance au contact est Ralenti.'
skill.esprit_inebranlable.name: Esprit inébranlable
skill.esprit_inebranlable.desc: 'Passif : sa volonté ne descend jamais sous 50 %.'
skill.hate.name: Hâte
skill.hate.desc: 'Hâte sur soi, 80 instants. DE : 40. EC : Ralenti.'
skill.paume_vide.name: Paume du vide
skill.paume_vide.desc: '25 psychiques + Confusion + −20 % de volonté. DE : dégâts seuls. EC : se confond.'
skill.seisme.name: Séisme
skill.seisme.desc: '20 dégâts aux ennemis des rangs 1 et 2, Étourdi au contact. DE : sans étourdir. EC : s’étourdit et perd 10 %.'
skill.fleche_givre.name: Flèche de givre
skill.fleche_givre.desc: '15 glace + Ralenti ; Gelé 20 si déjà ralenti (pas de nouveau gel sur la même cible pendant 100 instants). DE : Ralenti seul. EC : se ralentit.'
skill.grappin.name: Grappin
skill.grappin.desc: 'Attire la cible au rang 1. DE : d’un cran. EC : le lanceur est tiré au rang 1.'
skill.eclat_glace.name: Éclat de glace
skill.eclat_glace.desc: 16 glace + Ralenti 40.
skill.tempete_givre.name: Tempête de givre
skill.tempete_givre.desc: 14 glace et Ralenti 60 à tout un rang.
skill.pluie_feu.name: Pluie de feu
skill.pluie_feu.desc: 12 feu et Brûlure à tous les ennemis.
skill.eruption.name: Éruption
skill.eruption.desc: 24 feu à tous les ennemis, Étourdi 10 aux rangs 1-2.
skill.souffle_feu.name: Souffle de feu
skill.souffle_feu.desc: 18 feu et Brûlure à un rang proche.
skill.javelot_lumiere.name: Javelot de lumière
skill.javelot_lumiere.desc: 22 sacré, x2 contre les morts-vivants.
skill.nova_sacree.name: Nova sacrée
skill.nova_sacree.desc: 15 sacré aux ennemis des rangs 1-2.
skill.fleau.name: Fléau
skill.fleau.desc: Poison 4 par tic (3 charges) et 8 maladie.
skill.toucher_spectral.name: Toucher spectral
skill.toucher_spectral.desc: 18 ténèbres, rend la moitié en PV.
skill.lame_ombre.name: Lame d'ombre
skill.lame_ombre.desc: 1,3x l'arme en ténèbres.
skill.cri_effroi.name: Cri d'effroi
skill.cri_effroi.desc: −15 % de volonté aux ennemis des rangs 1-2.
skill.mot_silence.name: Mot de silence
skill.mot_silence.desc: 'Silence 80 : la cible ne peut plus lancer de sort à mana.'
skill.affaiblissement.name: Affaiblissement
skill.affaiblissement.desc: −25 % d’attaque pendant 80.
skill.jet_toile.name: Jet de toile
skill.jet_toile.desc: Ralenti 80 et attire d’un rang.
skill.coup_jarret.name: Coup au jarret
skill.coup_jarret.desc: 0,7x l’arme et Ralenti 60.
skill.tir_recul.name: Tir repoussant
skill.tir_recul.desc: 0,8x l’arme et repousse d’un rang.
skill.coup_tonnerre.name: Coup de tonnerre
skill.coup_tonnerre.desc: 1,2x l’arme et Étourdi 15.
skill.frappe_sismique.name: Frappe sismique
skill.frappe_sismique.desc: 0,9x l’arme à tout le rang au contact.
skill.assassinat.name: Assassinat
skill.assassinat.desc: 1,8x l’arme et Saignement.
skill.coup_massue.name: Coup de massue
skill.coup_massue.desc: 1,4x l’arme et repousse d’un rang.
skill.tir_perforant.name: Tir perforant
skill.tir_perforant.desc: 0,9x l’arme à tout le rang visé.
skill.tir_empoisonne.name: Tir empoisonné
skill.tir_empoisonne.desc: 0,9x l’arme et Poison.
skill.fleche_feu.name: Flèche enflammée
skill.fleche_feu.desc: 1x l’arme en feu et Brûlure.
skill.morsure_venin.name: Morsure venimeuse
skill.morsure_venin.desc: 0,9x l’arme et Poison.
skill.soin_majeur.name: Soin majeur
skill.soin_majeur.desc: +45 % des PV max.
skill.cercle_soins.name: Cercle de soins
skill.cercle_soins.desc: +18 % des PV max à tous les alliés.
skill.seve.name: Sève régénératrice
skill.seve.desc: Régénération +4 % par tic pendant 100.
skill.peau_ecorce.name: Peau d'écorce
skill.peau_ecorce.desc: +25 % de résistance à tout pendant 100.
skill.benediction.name: Bénédiction
skill.benediction.desc: +15 % de résistance à tout aux alliés pendant 80.
skill.chant_guerre.name: Chant de guerre
skill.chant_guerre.desc: +15 % d’attaque et +10 % de volonté aux alliés.
skill.vent_rapide.name: Vent rapide
skill.vent_rapide.desc: Hâte 60 aux alliés de son rang.
skill.carapace_epines.name: Carapace d'épines
skill.carapace_epines.desc: Renvoie 6 dégâts à chaque attaque au contact pendant 100.
skill.second_souffle.name: Second souffle
skill.second_souffle.desc: +30 % d’énergie et +8 % de PV.
