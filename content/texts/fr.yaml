route.ronces.name: 'Forêt des Ronces'
route.ronces.desc: 'Une forêt étouffée de ronces où gobelins, bêtes et araignées se disputent les sentiers. Le Sylvain qui garde son cœur barre la route du marais.'
route.ronces.steps.lisiere.name: 'Lisière'
route.ronces.steps.lisiere.desc: 'Des loups rôdent et quelques gobelins guettent les voyageurs.'
route.ronces.steps.sentier.name: 'Sentier des pillards'
route.ronces.steps.sentier.desc: 'Les bandes gobelines tiennent le sentier.'
route.ronces.steps.nids.name: 'Nids de soie'
route.ronces.steps.nids.desc: 'Les arbres sont pris dans les toiles.'
route.ronces.steps.camp.name: 'Camp gobelin'
route.ronces.steps.camp.desc: 'Le chaman y tient sa cour, protégé par un troll.'
route.ronces.steps.coeur.name: 'Cœur des Ronces'
route.ronces.steps.coeur.desc: 'Le gardien de la forêt. Le vaincre ouvre la route du marais.'
route.marais.name: 'Marais des Noyés'
route.marais.desc: 'Des eaux noires où les morts ne restent pas couchés. Au centre, la Mère des Noyés.'
route.marais.steps.berges.name: 'Berges'
route.marais.steps.berges.desc: 'Moustiques et crapauds sur la vase.'
route.marais.steps.roselieres.name: 'Roselières'
route.marais.steps.roselieres.desc: 'Les hommes-lézards chassent entre les roseaux.'
route.marais.steps.epaves.name: 'Cimetière des épaves'
route.marais.steps.epaves.desc: 'Des barques coulées, et ceux qui les menaient.'
route.marais.steps.tertre.name: 'Tertre de la sorcière'
route.marais.steps.tertre.desc: 'La sorcière noyée y garde ses bêtes.'
route.marais.steps.gouffre.name: 'Gouffre des Noyés'
route.marais.steps.gouffre.desc: 'La gardienne du marais.'
route.mines.name: 'Mines de Fer-Hurlant'
route.mines.desc: 'Des galeries abandonnées par les nains, reprises par les kobolds et pire encore.'
route.mines.steps.entree.name: 'Entrée des mines'
route.mines.steps.entree.desc: 'Kobolds et chauves-souris.'
route.mines.steps.galeries.name: 'Galeries effondrées'
route.mines.steps.galeries.desc: 'Les vers creusent de nouveaux tunnels.'
route.mines.steps.filons.name: 'Filons de cristal'
route.mines.steps.filons.desc: 'Les élémentaires gardent les gisements.'
route.mines.steps.puits.name: 'Puits du basilic'
route.mines.steps.puits.desc: 'Le regard du basilic fige les imprudents.'
route.mines.steps.forge.name: 'Forge oubliée'
route.mines.steps.forge.desc: 'Le gardien des mines.'
route.desert.name: 'Désert de Cendre'
route.desert.desc: 'Dunes grises et ruines brûlées. Un dragon dort sous la plus haute.'
route.desert.steps.dunes.name: 'Dunes grises'
route.desert.steps.dunes.desc: 'Vautours et scorpions.'
route.desert.steps.caravane.name: 'Piste des caravanes'
route.desert.steps.caravane.desc: 'Les pillards guettent les convois.'
route.desert.steps.tombeaux.name: 'Tombeaux ensablés'
route.desert.steps.tombeaux.desc: 'Les momies veillent leurs prêtres.'
route.desert.steps.verrerie.name: 'Champs de verre'
route.desert.steps.verrerie.desc: 'Le sable fondu a donné naissance à des golems.'
route.desert.steps.antre.name: 'Antre du dragon'
route.desert.steps.antre.desc: 'Le gardien du désert.'
route.ciel.name: 'Ruines Célestes'
route.ciel.desc: "Les marches brisées d'une cité tombée du ciel. L'Archonte déchu y règne encore."
route.ciel.steps.marches.name: 'Marches brisées'
route.ciel.steps.marches.desc: 'Harpies et gargouilles.'
route.ciel.steps.parvis.name: 'Parvis des sentinelles'
route.ciel.steps.parvis.desc: 'Les gardiens de marbre tiennent encore leur poste.'
route.ciel.steps.observatoire.name: 'Observatoire'
route.ciel.steps.observatoire.desc: 'Les astromanciens lisent un ciel qui n’existe plus.'
route.ciel.steps.jardins.name: 'Jardins suspendus'
route.ciel.steps.jardins.desc: 'Chimères et golems errent entre les fontaines.'
route.ciel.steps.trone.name: "Trône de l'Archonte"
route.ciel.steps.trone.desc: 'Le gardien des ruines.'
