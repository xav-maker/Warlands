region.ronces.name: Pays de Havre-Gris
region.ronces.city.name: Havre-Gris
region.ronces.city.desc: Capitale de la région. Banque, atelier, recrutement, temple et marchand.
region.ronces.territory.name: Forêt des Ronces
region.ronces.territory.desc: Une forêt étouffée de ronces où gobelins, bêtes et araignées se disputent les sentiers. Le Sylvain qui garde son cœur barre la route du marais.
region.ronces.steps.lisiere.name: Lisière
region.ronces.steps.lisiere.desc: Des loups rôdent et quelques gobelins guettent les voyageurs.
region.ronces.steps.sentier.name: Sentier des pillards
region.ronces.steps.sentier.desc: Les bandes gobelines tiennent le sentier.
region.ronces.steps.nids.name: Nids de soie
region.ronces.steps.nids.desc: Les arbres sont pris dans les toiles.
region.ronces.steps.camp.name: Camp gobelin
region.ronces.steps.camp.desc: Le chaman y tient sa cour, protégé par un troll.
region.ronces.steps.coeur.name: Cœur des Ronces
region.ronces.steps.coeur.desc: Le gardien de la forêt. Le vaincre ouvre la route du marais.
region.marais.name: Côte de Port-Salant
region.marais.city.name: Port-Salant
region.marais.city.desc: Port de pêcheurs adossé au marais, ses quais sentent la vase et le goudron.
region.marais.territory.name: Marais des Noyés
region.marais.territory.desc: Des eaux noires où les morts ne restent pas couchés. Au centre, la Mère des Noyés.
region.marais.steps.berges.name: Berges
region.marais.steps.berges.desc: Moustiques et crapauds sur la vase.
region.marais.steps.roselieres.name: Roselières
region.marais.steps.roselieres.desc: Les hommes-lézards chassent entre les roseaux.
region.marais.steps.epaves.name: Cimetière des épaves
region.marais.steps.epaves.desc: Des barques coulées, et ceux qui les menaient.
region.marais.steps.tertre.name: Tertre de la sorcière
region.marais.steps.tertre.desc: La sorcière noyée y garde ses bêtes.
region.marais.steps.gouffre.name: Gouffre des Noyés
region.marais.steps.gouffre.desc: La gardienne du marais.
region.mines.name: Monts de Rochecreuse
region.mines.city.name: Rochecreuse
region.mines.city.desc: Cité naine creusée dans la montagne, forges allumées jour et nuit.
region.mines.territory.name: Mines de Fer-Hurlant
region.mines.territory.desc: Des galeries abandonnées par les nains, reprises par les kobolds et pire encore.
region.mines.steps.entree.name: Entrée des mines
region.mines.steps.entree.desc: Kobolds et chauves-souris.
region.mines.steps.galeries.name: Galeries effondrées
region.mines.steps.galeries.desc: Les vers creusent de nouveaux tunnels.
region.mines.steps.filons.name: Filons de cristal
region.mines.steps.filons.desc: Les élémentaires gardent les gisements.
region.mines.steps.puits.name: Puits du basilic
region.mines.steps.puits.desc: Le regard du basilic fige les imprudents.
region.mines.steps.forge.name: Forge oubliée
region.mines.steps.forge.desc: Le gardien des mines.
region.desert.name: Terres de Cendrelune
region.desert.city.name: Cendrelune
region.desert.city.desc: Oasis fortifiée au bord du désert, carrefour des caravanes.
region.desert.territory.name: Désert de Cendre
region.desert.territory.desc: Dunes grises et ruines brûlées. Un dragon dort sous la plus haute.
region.desert.steps.dunes.name: Dunes grises
region.desert.steps.dunes.desc: Vautours et scorpions.
region.desert.steps.caravane.name: Piste des caravanes
region.desert.steps.caravane.desc: Les pillards guettent les convois.
region.desert.steps.tombeaux.name: Tombeaux ensablés
region.desert.steps.tombeaux.desc: Les momies veillent leurs prêtres.
region.desert.steps.verrerie.name: Champs de verre
region.desert.steps.verrerie.desc: Le sable fondu a donné naissance à des golems.
region.desert.steps.antre.name: Antre du dragon
region.desert.steps.antre.desc: Le gardien du désert.
region.ciel.name: Hauteurs de l'Aube
region.ciel.city.name: Sanctuaire de l'Aube
region.ciel.city.desc: Dernier temple debout au pied des ruines célestes.
region.ciel.territory.name: Ruines Célestes
region.ciel.territory.desc: Les marches brisées d'une cité tombée du ciel. L'Archonte déchu y règne encore.
region.ciel.steps.marches.name: Marches brisées
region.ciel.steps.marches.desc: Harpies et gargouilles.
region.ciel.steps.parvis.name: Parvis des sentinelles
region.ciel.steps.parvis.desc: Les gardiens de marbre tiennent encore leur poste.
region.ciel.steps.observatoire.name: Observatoire
region.ciel.steps.observatoire.desc: Les astromanciens lisent un ciel qui n’existe plus.
region.ciel.steps.jardins.name: Jardins suspendus
region.ciel.steps.jardins.desc: Chimères et golems errent entre les fontaines.
region.ciel.steps.trone.name: Trône de l'Archonte
region.ciel.steps.trone.desc: Le gardien des ruines.
