# Escouades de référence par palier (guide 5.3) : 11 de population et 8 unités au plus, un tank, au moins un soigneur,
# des dégâts au contact et à distance. Elles sont montées au niveau le plus haut des monstres de l’étape (+ offset),
# dans la meilleure forme de ce niveau (les évolutions des niveaux 10 et 20 remplacent la forme de base) et, par défaut,
# équipées au palier de la route. Le second nombre de chaque troupe est son rang (1 devant, 3 derrière).
#
# `steps` règle une étape seule (1 à 5) : au tout début de la partie, l’escouade n’est pas pleine et son niveau est en
# retard sur celui des monstres, donc les premières étapes du palier 1 sont jouées avec l’escouade de départ
# (2 Miliciens, 2 Chasseurs, puis l’Acolyte recruté) qui se remplit peu à peu.

'1':
  offset: 0
  troops: [[milicien, 1], [ecuyer, 1], [moine, 1], [acolyte, 3], [herboriste, 3], [chasseur, 3], [braconniers, 3]]
  steps:
    '1':
      offset: -3
      gear: false
      troops: [[milicien, 1], [milicien, 1], [chasseur, 3], [chasseur, 3], [acolyte, 3]]
    '2':
      offset: -2
      troops: [[milicien, 1], [milicien, 1], [ecuyer, 1], [chasseur, 3], [chasseur, 3], [acolyte, 3]]
    '3':
      offset: -1
      troops: [[milicien, 1], [ecuyer, 1], [moine, 1], [chasseur, 3], [chasseur, 3], [acolyte, 3], [herboriste, 3]]
'2':
  offset: 0
  troops: [[milicien, 1], [gardes_maree, 1], [berserker, 1], [acolyte, 3], [pyromancien, 3], [chasseur, 3]]
'3':
  offset: 0
  troops: [[gardien_pierre, 1], [forgeron_runes, 1], [eclaireuse, 1], [acolyte, 3], [mage_cristal, 3], [chasseur, 3]]
'4':
  offset: 0
  troops: [[garde_oasis, 1], [lanciers_cendres, 1], [pretresse_soleil, 3], [mage_cendre, 3], [nomade, 3], [acolyte, 3]]
'5':
  offset: 0
  troops: [[paladin, 1], [lames_jumelles, 1], [archonte_aube, 3], [tireur_astral, 3], [acolyte, 3]]
